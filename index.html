<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Giảm cache (không đảm bảo 100% trên mọi CDN, nhưng giúp rất nhiều) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <title>Mock Test One</title>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f2f2f2; }

    /* ===== Layout 2 cột ===== */
    .container{
      height: 100vh;
      display: flex;
      background: #fff;
    }
    .left{
      width: 66.66%;
      overflow-y: auto;
      padding: 26px 26px;
      background: #f9f9f9;
      border-right: 2px solid #d9d9d9;
    }
    .right{
      width: 33.33%;
      padding: 16px;
      background: #fff;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow: hidden; /* để iframe tự cuộn */
    }

    /* ===== Header rõ ràng hơn ===== */
    .page-title{
      display:flex;
      align-items:center;
      gap:12px;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 0.5px;
      margin: 0 0 22px 0;
      padding: 16px 18px;
      color: #0f172a;
      background: linear-gradient(90deg, #dbeafe, #eff6ff);
      border-left: 8px solid #2563eb;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
    }

    h2{
      margin: 28px 0 14px;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 0.8px;
      color: #0f172a;
      background: #eaf2ff;
      border-left: 8px solid #2563eb;
      padding: 14px 18px;
      border-radius: 10px;
      text-transform: uppercase;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
    }

    /* Nếu sau này bạn gõ nội dung bằng thẻ <p>, đoạn văn sẽ được highlight rõ hơn */
    p, .note-box, .instruction-box{
      font-size: 22px;
      line-height: 1.65;
      font-weight: 600;
      color: #111827;
      background: #fff7cc;
      border-left: 7px solid #f59e0b;
      padding: 16px 20px;
      border-radius: 10px;
      margin: 16px 0;
    }

    /* ===== Media ===== */
    img{
      width: 100%;
      max-width: 1080px;
      height: auto;
      display: block;
      margin: 14px auto 22px;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 3px 12px rgba(15, 23, 42, 0.10);
    }

    audio{
      width: 100%;
      max-width: 520px;  /* giống thanh audio trong hình bạn muốn */
      display: block;
      margin: 8px 0 14px;
    }

    /* ===== Form ===== */
    .form-title{
      display:flex;
      align-items:center;
      gap:10px;
      font-size: 22px;
      font-weight: 800;
      margin: 0;
    }
    .iframe-wrap{
      flex: 1;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
    }
    iframe{
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* ===== Responsive (điện thoại) ===== */
    @media (max-width: 900px){
      .container{ flex-direction: column; height: auto; }
      .left,.right{ width: 100%; height: auto; }
      .right{ min-height: 80vh; }
      .iframe-wrap{ min-height: 80vh; }
      img, audio{ max-width: 100%; }
    }
  </style>

  <!-- ✅ Cache-busting: chỉ cần đổi VERSION là ảnh/mp3 tự refresh -->
  <script>
    const VERSION = "20251227_01"; // <- Mỗi lần update file: đổi số này (01 -> 02 -> 03...)

    window.addEventListener("DOMContentLoaded", () => {
      // gắn ?v=VERSION cho ảnh + mp3
      document.querySelectorAll("img[data-src], source[data-src]").forEach(el => {
        const base = el.getAttribute("data-src");
        el.setAttribute("src", base + "?v=" + VERSION);
      });

      // nếu muốn cả trang cũng “đổi link” để tránh cache HTML:
      // (không bắt buộc, nhưng hữu ích)
      const url = new URL(window.location.href);
      if (url.searchParams.get("v") !== VERSION) {
        url.searchParams.set("v", VERSION);
        history.replaceState(null, "", url.toString());
      }
    });
  </script>
</head>

<body>
  <div class="container">
    <div class="left">
      <div class="page-title">📘 Mock Test One</div>

   

      <h2>🔊 LISTEN 1x</h2>
      <audio controls>
        <source data-src="AUDIO/Part1.mp3" type="audio/mpeg" />
        Trình duyệt của bạn không hỗ trợ audio.
      </audio>
      <img data-src="JPG1/L1.jpg" alt="l1" />
      <img data-src="JPG1/l1-1.jpg" alt="l1-1" />

      <h2>🔊 LISTEN 2x</h2>
      <audio controls>
        <source data-src="AUDIO/Part2.mp3" type="audio/mpeg" />
        Trình duyệt của bạn không hỗ trợ audio.
      </audio>
      <img data-src="JPG1/L2.jpg" alt="l2" />

      <h2>🔊 LISTEN 3x</h2>
      <audio controls>
        <source data-src="AUDIO/Part3.mp3" type="audio/mpeg" />
        Trình duyệt của bạn không hỗ trợ audio.
      </audio>
      <img data-src="JPG1/L3.jpg" alt="l3" />

      <h2>🔊 LISTEN 4x</h2>
      <audio controls>
        <source data-src="AUDIO/Part4.mp3" type="audio/mpeg" />
        Trình duyệt của bạn không hỗ trợ audio.
      </audio>
      <img data-src="JPG1/L4.jpg" alt="l4" />

      <h2>🔊 LISTEN 5x</h2>
      <audio controls>
        <source data-src="AUDIO/Part5.mp3" type="audio/mpeg" />
        Trình duyệt của bạn không hỗ trợ audio.
      </audio>
      <img data-src="JPG1/L5.jpg" alt="l5" />

      <h2>✍️ WRITING</h2>
      <img data-src="JPG1/w1.jpg" alt="w1" />
    </div>

    <div class="right">
      <div class="form-title">✅ Trả lời</div>
      <div class="iframe-wrap">
        <iframe
         src="https://docs.google.com/forms/d/e/1FAIpQLSfnMjBC0SSAq3OpEc0TUwMM0hXZDACkd-g_ctldgpQmeHv7Ow/viewform?embedded=true"
          allowfullscreen
          loading="lazy">
        </iframe>
      </div>
    </div>
  </div>
</body>
</html>
